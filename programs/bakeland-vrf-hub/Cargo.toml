[package]
name = "bakeland-vrf-hub"
version = "0.1.0"
description = "Reusable, multi-application MagicBlock VRF coordinator for Bakeland"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "bakeland_vrf_hub"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "=0.15.4", default-features = false, features = ["anchor", "vrf", "solana-system-interface"] }
solana-sha256-hasher = "2.3.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
